<!-- 02_asset_form.html — Asset Create/Edit Bottom Sheet Form Module -->
<div id="asset-form-placeholder">
  <div class="form-group">
    <label>名称 *</label>
    <input type="text" v-model="formData.name" placeholder="输入资产名称">
  </div>
  <div class="form-group">
    <label>分类</label>
    <select v-model="formData.category_id">
      <option value="">选择分类</option>
      <optgroup v-for="cat in flatCategories" :key="cat.id" :label="cat.label" v-if="cat.children && cat.children.length">
        <option v-for="sub in cat.children" :key="sub.id" :value="sub.id">{{ sub.name }}</option>
      </optgroup>
      <option v-for="cat in flatCategories" :key="cat.id" :value="cat.id" v-if="!cat.children || !cat.children.length">{{ cat.name }}</option>
    </select>
  </div>
  <div class="form-group">
    <label>渠道</label>
    <select v-model="formData.channel_id">
      <option value="">选择渠道</option>
      <option v-for="ch in channels" :key="ch.id" :value="ch.id">{{ ch.name }}</option>
    </select>
  </div>
  <div class="form-group">
    <label>购买价格 (¥)</label>
    <input type="number" step="0.01" min="0" v-model.number="formData.purchase_price" placeholder="0.00">
  </div>
  <div class="form-group">
    <label>购买日期</label>
    <input type="date" v-model="formData.purchase_date">
  </div>
  <div class="form-group">
    <label>当前价值 (¥)</label>
    <input type="number" step="0.01" min="0" v-model.number="formData.current_value" placeholder="0.00">
  </div>
  <div class="form-group">
    <label>状态</label>
    <select v-model="formData.status">
      <option value="active">使用中</option>
      <option value="sold">已出售</option>
      <option value="discarded">已丢弃</option>
      <option value="lost">已遗失</option>
    </select>
  </div>
  <div class="form-group">
    <label>备注</label>
    <textarea v-model="formData.notes" rows="3" placeholder="备注信息"></textarea>
  </div>
  <button style="width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px"
          @click="submitAssetForm" :disabled="!formData.name.trim()">
    {{ editingAssetId ? '更新' : '保存' }}
  </button>
</div>

<script>
// ===== Asset Form Module =====
// Depends on: 00_base.html (Vue App, window.__chiwu_app, window.__chiwu_api)

function setupAssetFormModule() {
  const { ref, reactive, computed, watch } = Vue;
  const api = window.__chiwu_api;
  const app = window.__chiwu_app;

  // --- Reactive form data ---
  const defaultForm = () => ({
    name: '',
    category_id: '',
    channel_id: '',
    purchase_price: null,
    purchase_date: '',
    current_value: null,
    status: 'active',
    notes: ''
  });

  const formData = reactive(defaultForm());

  // --- Computed: flattened categories with parent naming ---
  const flatCategories = computed(() => {
    const cats = api.categories.value || [];
    const result = [];
    for (const cat of cats) {
      if (cat.children && cat.children.length > 0) {
        result.push({
          id: cat.id,
          label: cat.name,
          name: `— ${cat.name}`,
          children: cat.children.map(sub => ({
            id: sub.id,
            name: `${cat.name} / ${sub.name}`,
            parentName: cat.name
          }))
        });
      } else {
        result.push({ id: cat.id, name: cat.name });
      }
    }
    return result;
  });

  // --- Watch editingAssetId to load existing data ---
  watch(() => api.editingAssetId.value, (newId) => {
    if (newId) {
      loadAssetForEdit(newId);
    } else {
      Object.assign(formData, defaultForm());
    }
  });

  async function loadAssetForEdit(id) {
    try {
      const asset = await api.api(`/assets/${id}`);
      formData.name = asset.name || '';
      formData.category_id = asset.category_id ? String(asset.category_id) : '';
      formData.channel_id = asset.channel_id ? String(asset.channel_id) : '';
      formData.purchase_price = asset.purchase_price != null ? Number(asset.purchase_price) : null;
      formData.purchase_date = asset.purchase_date || '';
      formData.current_value = asset.current_value != null ? Number(asset.current_value) : null;
      formData.status = asset.status || 'active';
      formData.notes = asset.notes || '';
    } catch (err) {
      console.error('Failed to load asset for edit:', err);
    }
  }

  // --- Submit ---
  async function submitAssetForm() {
    if (!formData.name.trim()) return;

    const payload = {
      name: formData.name.trim(),
      category_id: formData.category_id ? Number(formData.category_id) : null,
      channel_id: formData.channel_id ? Number(formData.channel_id) : null,
      purchase_price: formData.purchase_price,
      purchase_date: formData.purchase_date || null,
      current_value: formData.current_value,
      status: formData.status,
      notes: formData.notes.trim()
    };

    try {
      if (api.editingAssetId.value) {
        await api.api(`/assets/${api.editingAssetId.value}`, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
      } else {
        await api.api('/assets', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
      }

      // Close form and refresh list
      api.editingAssetId.value = null;
      api.showAssetForm.value = false;
      Object.assign(formData, defaultForm());

      // Trigger refresh if the assets list module has a refresh function
      if (typeof window.__chiwu_refresh_assets === 'function') {
        window.__chiwu_refresh_assets();
      }
    } catch (err) {
      console.error('Failed to save asset:', err);
      alert('保存失败: ' + err.message);
    }
  }

  // Expose to template scope (used in the template above)
  return { formData, flatCategories, submitAssetForm };
}

// Register module on mount
if (window.__chiwu_app) {
  const moduleResult = setupAssetFormModule();
  // Patch module properties into app so template can access them
  const app = window.__chiwu_app;
  // We use provide/inject or expose pattern — simplest: merge into setupState
  const state = window.__chiwu_api;
  Object.assign(state, moduleResult);
}
</script>
